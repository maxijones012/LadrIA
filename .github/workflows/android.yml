name: Compilar LadrIA APK (manual)
on:
  # Disparo puntual por archivo de solicitud, nunca por cambios comunes de código.
  push:
    branches: [main]
    paths: ['ci/build-request.txt']
  workflow_dispatch:
    inputs:
      canal:
        description: 'test = debug, release = APK público firmado'
        type: choice
        options: [test, release]
        default: test
      version_name:
        description: 'Versión semántica (ej. 0.2.0)'
        type: string
        default: '0.4.0'
      version_code:
        description: 'Entero superior al último publicado (ej. 2)'
        type: number
        default: 4
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ya trae Android SDK/cmdline-tools. El setup-android v3
      # intenta instalar el paquete eliminado 'tools' y falla en 2026.
      - name: Preparar SDK Android
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms/android-35" ] && [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "Android 35 y build-tools 35 ya están instalados"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
            test -n "$SDKMANAGER" || { echo "No se halló sdkmanager en cmdline-tools"; exit 1; }
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Descargar y validar YAMNet
        run: python3 scripts/prepare_model.py
      - name: Verificar datos release y preparar JKS
        if: inputs.canal == 'release'
        env:
          RELEASE_KEY_B64: ${{ secrets.LADRIA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LADRIA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LADRIA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LADRIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEY_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Faltan secretos de firma release'; exit 1; }
          printf '%s' "$RELEASE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/ladria-release.jks"
          chmod 600 "$RUNNER_TEMP/ladria-release.jks"
          echo "LADRIA_KEYSTORE_PATH=$RUNNER_TEMP/ladria-release.jks" >> "$GITHUB_ENV"
      - name: Build (una sola variante)
        env:
          LADRIA_VERSION_NAME: ${{ inputs.version_name || '0.4.0' }}
          LADRIA_VERSION_CODE: ${{ inputs.version_code || 4 }}
          LADRIA_STORE_PASSWORD: ${{ secrets.LADRIA_STORE_PASSWORD }}
          LADRIA_KEY_ALIAS: ${{ secrets.LADRIA_KEY_ALIAS }}
          LADRIA_KEY_PASSWORD: ${{ secrets.LADRIA_KEY_PASSWORD }}
        run: |
          if [ '${{ inputs.canal || 'test' }}' = release ]; then
            gradle --no-daemon :app:assembleRelease
          else
            gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
          fi
      - name: Verificar certificado del APK firmado
        if: inputs.canal == 'release'
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Artefacto de pruebas (NO sirve para actualizar)
        if: inputs.canal == 'test' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: LadrIA-test-${{ inputs.version_name || '0.4.0' }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar release oficial (requiere firma permanente)
        if: inputs.canal == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ inputs.version_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then echo "Ya existe $tag"; exit 1; fi
          cp app/build/outputs/apk/release/app-release.apk "LadrIA-${tag}.apk"
          sha256sum "LadrIA-${tag}.apk" > SHA256SUMS.txt
          gh release create "$tag" "LadrIA-${tag}.apk" SHA256SUMS.txt --title "LadrIA $tag" --notes "APK release firmado. Verificar cambios y huella de firma antes de instalar." --latest
      - name: Borrar JKS temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/ladria-release.jks"
